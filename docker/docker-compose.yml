version: '3.8'

services:
  freedom-db:
    image: postgres:16-alpine
    container_name: freedom-postgres
    restart: always
    environment:
      POSTGRES_DB: freedom_erp
      POSTGRES_USER: freedom_user
      POSTGRES_PASSWORD: freedom_secure_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - freedom_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freedom_user -d freedom_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  freedom-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: freedom-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@freedom-erp.com.br
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      freedom-db:
        condition: service_healthy

volumes:
  freedom_pgdata:

